[package]
name = "vesktop-rust"
version = "0.1.0"
description = "Experimental Rust/Tauri desktop runtime for Vesktop"
authors = ["Vesktop contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = "=3.0.0-alpha.4"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=3.0.0-alpha.6"
tauri-runtime-cef = { version = "=3.0.0-alpha.7", features = ["devtools", "unstable"] }
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-single-instance = "=3.0.0-alpha.3"
tempfile = "3"
tokio = { version = "1", features = ["time"] }
url = "2"
