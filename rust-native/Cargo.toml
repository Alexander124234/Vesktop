[package]
name = "vesktop-rust"
version = "0.1.0"
description = "Experimental Rust/Tauri desktop runtime for Vesktop"
authors = ["Vesktop contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = "2.7"

[dependencies]
serde_json = "1"
tauri = "2.12"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tempfile = "3"
url = "2"
