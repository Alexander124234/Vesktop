name: Rust native preview

on:
    push:
        branches:
            - rust-native-preview
        paths:
            - "rust-native/**"
            - ".github/workflows/rust-native.yml"
    pull_request:
        paths:
            - "rust-native/**"
            - ".github/workflows/rust-native.yml"

jobs:
    check-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - name: Install Tauri build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential curl wget file libssl-dev \
                    libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                    libxdo-dev librsvg2-dev
            - name: Install Rust
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - name: Check formatting
              run: cargo fmt --manifest-path rust-native/Cargo.toml --all -- --check
            - name: Check Rust application
              run: cargo check --manifest-path rust-native/Cargo.toml
